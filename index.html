<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Flow | Air Distribution Sizing Tool</title>
<meta name="description" content="Size diffusers, grilles, louvers and dampers by CFM: neck velocity, pressure drop, NC and throw, then export a project schedule or request a quote.">
<meta name="theme-color" content="#0b1329">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1329;--card:#132247;--c2:#0f1b3a;--ac:#4cd5f6;--ink:#e9efff;--mute:#a3b3da;--line:#2a3f78;--ok:#58e0a0;--warn:#ffcc66;--bad:#ff8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:radial-gradient(90% 50% at 80% -10%,#1b3a78 0,transparent 60%),var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:auto;padding:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px}
header img{height:40px;background:#fff;border-radius:10px;padding:3px 10px}
header h1{font-size:clamp(20px,3.4vw,28px);margin:0;font-weight:700;line-height:1.3}
header p{margin:0;color:var(--mute);font-size:14px}
.hd{flex:1;min-width:200px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#0b1329;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--ac)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{border-color:var(--ac);box-shadow:none}
.btn.s{padding:7px 14px;font-size:14px;border-radius:10px}
.grid{display:grid;gap:16px}
@media (min-width:960px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,26px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--c2);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{background:transparent;border:0;padding:10px 8px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:500;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ac);color:#0b1329;font-weight:700}
label,.lb{display:block;font-size:13.5px;color:var(--mute);margin:14px 0 6px}
select,input[type=number],input[type=text],input[type=date]{width:100%;background:var(--c2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
select:hover,input:hover{border-color:#43609f}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{direction:ltr;background:var(--c2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;transition:all .15s}
.chips button:hover{border-color:var(--ac)}.chips button[aria-pressed="true"]{background:var(--ac);color:#0b1329;border-color:var(--ac);font-weight:700}
.chips button:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.m{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.m small{display:block;color:var(--mute);font-size:13px}.m b{font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.25}.m i{font-style:normal;color:var(--mute);font-size:13px;margin-inline-start:4px}
.bar{height:10px;border-radius:5px;background:var(--c2);position:relative;overflow:hidden;margin:6px 0 4px}
.bar span{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#1c8fb0,var(--ac));transition:left .4s,width .4s}
.bar u{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;border-radius:2px;transition:left .3s}
.st{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;border:1px solid}
.ok{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}
.rec{display:grid;gap:10px;margin-top:14px}
.rc{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.rc.best{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.rc .t{font-size:20px;font-weight:700;min-width:90px}.rc .d{color:var(--mute);font-size:14px;flex:1;min-width:180px}
h2{font-size:20px;margin:0 0 4px}
.note{font-size:12.5px;color:var(--mute);margin:12px 0 0}
.tw{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--c2);color:var(--mute);font-weight:500}tr:last-child td{border-bottom:0}
td input{width:70px;padding:5px 8px;border-radius:8px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.empty{padding:26px;text-align:center;color:var(--mute)}
input[type=date]{direction:ltr;text-align:start;min-height:46px;font-variant-numeric:tabular-nums}input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.85);cursor:pointer}
a.btn{display:inline-block;text-decoration:none;text-align:center}.ctg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.ci{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:12px 16px}.ci small{display:block;color:var(--mute);font-size:13px}.ci a{color:var(--ac);font-weight:500;overflow-wrap:anywhere}
#toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;max-width:360px;background:var(--ac);color:#0b1329;font-weight:700;text-align:center;border-radius:14px;padding:11px 16px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}#toast.on{opacity:1;transform:none}
#ps{display:none}
@media print{body{background:#fff;color:#000}.wrap{display:none}#ps{display:block;font-family:Tajawal,Arial,sans-serif;color:#111;padding:8mm}#ps img{height:44px}#ps table{min-width:0;font-size:11px}#ps th{background:#e8eef7;color:#111}#ps td,#ps th{border:1px solid #bbb;padding:5px 7px}#ps h1{font-size:20px;margin:12px 0 6px}.pi{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:12px;margin:10px 0 14px}#ps p{font-size:10.5px;color:#444}@page{size:A4 landscape;margin:10mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
